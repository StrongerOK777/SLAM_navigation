slam_toolbox:
  ros__parameters:
    # ---------- 坐标系 ----------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_sim_time: true          # 仿真中必须为 true

    mode: mapping               # mapping = 建图；localization = 用已有图定位

    # ---------- 地图 ----------
    resolution: 0.05            # 每个栅格 5 cm。太小→内存爆炸、太大→细节丢失
    map_update_interval: 2.0    # 每 2 秒更新一次 /map（越小越卡）
    max_laser_range: 3.5        # burger 的 LDS-01 有效量程就是 3.5 m
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # ---------- 关键帧触发 ----------
    # 走多远 / 转多少角度才插入一个新关键帧
    minimum_travel_distance: 0.2      # 单位 m
    minimum_travel_heading: 0.2       # 单位 rad (约 11.5°)
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0

     # ---------- 回环检测（收紧，防止误匹配）----------
    do_loop_closing: true
    loop_search_maximum_distance: 2.0      # 3.0 → 2.0，只在附近找回环
    loop_match_minimum_chain_size: 15      # 8 → 15，要求更多连续帧一致
    loop_match_minimum_response_coarse: 0.5   # 0.35 → 0.5
    loop_match_minimum_response_fine: 0.6     # 0.45 → 0.6，match 质量门槛提高

    # ---------- 扫描匹配 ----------
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ---------- 优化器 ----------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None